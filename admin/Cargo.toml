[package]
name = "postwright-admin"
version = "0.3.0"
edition = "2021"
description = "Desktop administration app for the Postwright mail server"
license = "MIT"

[[bin]]
name = "postwright-admin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
webpki-roots = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
