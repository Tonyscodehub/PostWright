<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postwright – Sign in</title>
<style>
  :root { --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --bg:#f5f6f8; --card:#fff; --accent:#1f5f8b; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9ef; --muted:#9aa3b2; --line:#30363f; --bg:#14171c; --card:#1c2027; --accent:#6aa9d8; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  form { width:min(380px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 28px 24px; }
  h1 { margin:0 0 2px; font-size:22px; }
  p { margin:0 0 18px; color:var(--muted); font-size:14px; }
  label { display:block; font-weight:600; margin:14px 0 4px; font-size:14px; }
  input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; font:inherit; color:inherit; background:transparent; }
  #code { font-size:22px; letter-spacing:4px; text-align:center; }
  button { width:100%; margin-top:20px; padding:10px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:12px; }
  .hidden { display:none; }
  a { color:var(--accent); font-size:14px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Postwright</h1>
  <p id="sub">Sign in to your mail settings</p>
  <div id="step1">
    <label for="email">Email address</label>
    <input type="email" id="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
  </div>
  <div id="step2" class="hidden">
    <label for="code">Code from your authenticator app</label>
    <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="11" placeholder="123456">
    <p style="margin-top:10px">Lost your phone? Enter one of your recovery codes instead.</p>
  </div>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script src="/login.js"></script>
</body>
</html>
