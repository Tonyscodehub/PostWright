[package]
name = "postwright"
version = "0.4.0"
edition = "2021"
description = "Secure, multi-domain SMTP + IMAP mail server written in Rust"
license = "MIT"

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.25", features = ["tokio", "system-config"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "ring", "rustls-native-certs"] }
mail-auth = { version = "0.7", default-features = false, features = ["rust-crypto"] }
mail-parser = "0.11"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rsa = "0.9"
rpassword = "7.5.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
quick-xml = "0.42.0"
serde_json = "1.0.154"
pwhash = "1.0.0"
sha1 = "0.10"
md-5 = "0.10"
russh-sftp = "3"
x509-parser = "0.18.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
hmac = "0.12"
data-encoding = "2.11.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = [".", "admin"]
